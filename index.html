<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Foco no Chinelo - Chinelos personalizados artesanalmente com bordados de pérolas e acabamentos exclusivos sob encomenda. Birigui - SP.">
  <meta name="author" content="Aline Araújo">
  <title>Foco no Chinelo | Chinelos Personalizados Artesanais</title>

  <!-- Google Fonts: Tipografia moderna e sofisticada -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Folha de Estilos Principal -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Cabeçalho Principal -->
  <header class="site-header" id="header">
    <div class="container header-container">
      <div class="brand">
        <span class="brand-name">Foco no Chinelo</span>
        <span class="brand-tagline">Artesanato &amp; Elegância</span>
      </div>
      <nav class="nav-menu" id="nav-menu" aria-label="Navegação Principal">
        <a href="#vitrine" class="nav-link">Modelos</a>
        <a href="#sobre" class="nav-link">Sobre</a>
        <a href="#contato" class="nav-link btn-contato">Fazer Encomenda</a>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main id="main-content">
    <!-- Seção Hero / Apresentação -->
    <section class="hero-section" id="inicio">
      <div class="container hero-container">
        <!-- Estrutura base da apresentação -->
      </div>
    </section>

    <!-- Seção Vitrine de Modelos (Organização para os 7 Modelos) -->
    <section class="vitrine-section" id="vitrine" aria-labelledby="vitrine-titulo">
      <div class="container">
        <header class="section-header">
          <h2 id="vitrine-titulo" class="section-title">Coleção Exclusiva</h2>
          <p class="section-subtitle">Peças artesanais confeccionadas sob encomenda em Birigui – SP</p>
        </header>

        <!-- Grade reservada para os 7 modelos individuais -->
        <div class="produtos-grid" id="produtos-grid" aria-live="polite">
          <!-- Os 7 modelos serão estruturados na próxima etapa -->
        </div>
      </div>
    </section>

    <!-- Seção Sobre a Artesã & Processo -->
    <section class="sobre-section" id="sobre">
      <div class="container sobre-container">
        <!-- Estrutura base sobre Aline Araújo e o trabalho manual -->
      </div>
    </section>
  </main>

  <!-- Rodapé & Informações de Contato -->
  <footer class="site-footer" id="contato">
    <div class="container footer-container">
      <!-- Estrutura base de dados de contato e localização -->
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/main.js" defer></script>
</body>
</html>
